services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plantguard}
      POSTGRES_USER: ${POSTGRES_USER:-plantguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes: [plantguard_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://plantguard:change-this-local-password@db:5432/plantguard}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MODEL_PATH: ${MODEL_PATH:-/app/models/plantguard_mobilenetv2.pt}
    volumes: ["./models:/app/models:ro"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [api]
volumes:
  plantguard_db:
